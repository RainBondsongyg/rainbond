name: build-cleanup-api-devs10

on:
  push:
    branches:
      - codex/cleanup-api-devs10

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    environment: release-v6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libzmq3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify cleanup packages
        run: go test -mod=mod ./api/controller ./pkg/cleanup/... -count=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOMESTIC_DOCKER_USERNAME }}
          password: ${{ secrets.DOMESTIC_DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hack/contrib/docker/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: registry.cn-hangzhou.aliyuncs.com/goodrain/rbd-api:v6.9.11-devs10
